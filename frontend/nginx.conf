server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El enrutador funciona en modo history: `/ventas` es una ruta del navegador,
    # no un archivo en disco. Sin este reenvío, recargar la página en cualquier
    # pantalla que no sea la raíz devolvería 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los recursos compilados llevan un hash en el nombre: cambian de nombre al
    # cambiar de contenido, así que pueden cachearse indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El índice, en cambio, no debe cachearse: es quien apunta a la versión
    # nueva de esos recursos tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
