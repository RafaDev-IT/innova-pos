name: CI

on:
  push:
    branches: [main, ProductionEnv, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, ProductionEnv]
  # Permite lanzar la verificación a demanda desde la pestaña Actions, sin
  # tener que empujar un commit vacío para forzarla.
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint y tests
    runs-on: ubuntu-latest

    # Postgres real como servicio: los tests corren contra el mismo motor que
    # producción, no contra SQLite en memoria.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: pos_password
          POSTGRES_DB: innova_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: pos_user
      DB_PASSWORD: pos_password
      DB_NAME: innova_pos
      DB_NAME_TEST: innova_pos_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend — lint, tests y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
